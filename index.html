                      {item.priority} Priority
                    </span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${
                      item.status === 'Resolved' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'
                    }`}>
                      {item.status}
                    </span>
                  </div>

                  <h3 className="text-sm font-bold text-slate-800">{item.title}</h3>
                  
                  <div className="flex items-center space-x-4 text-[11px] text-slate-500">
                    <span className="flex items-center space-x-1"><LucideIcon name="building" className="w-3 h-3 text-slate-400" /><span>{item.dept}</span></span>
                    <span className="flex items-center space-x-1"><LucideIcon name="calendar" className="w-3 h-3 text-slate-400" /><span>{item.date}</span></span>
                  </div>
                </div>

                <div className="flex items-center justify-between sm:justify-end space-x-4 border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100">
                  <div className="text-right">
                    <span className="text-[10px] uppercase text-slate-400 font-bold block">SLA Status</span>
                    <span className="text-xs font-bold text-slate-700">{item.sla}</span>
                  </div>
                  <div className="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-cms-green hover:text-white transition-colors">
                    <LucideIcon name="chevron-right" className="w-4 h-4" />
                  </div>
                </div>
              </div>
            ))}
          </div>

        </div>
      );
    };

    // --- STUDENT PROFILE SCREEN ---
    const ProfileScreen = ({ setActiveScreen }) => {
      return (
        <div className="max-w-3xl mx-auto px-4 py-8 space-y-6">
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
            
            <div className="flex items-center space-x-4 border-b border-slate-100 pb-6">
              <div className="w-16 h-16 rounded-full bg-cms-green text-cms-gold text-2xl font-black flex items-center justify-center shadow-lg">
                AK
              </div>
              <div>
                <h1 className="text-2xl font-extrabold text-slate-800">Arjun Kumar</h1>
                <p className="text-xs font-mono text-cms-green font-bold mt-0.5">Registration No: CMSCE21CS045</p>
                <p className="text-xs text-slate-500">Department of Computer Science & Engineering</p>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                <span className="text-slate-400 uppercase font-bold block mb-1">Official Email</span>
                <span className="font-bold text-slate-800">yourname@cmsce.edu.in</span>
              </div>
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                <span className="text-slate-400 uppercase font-bold block mb-1">Current Academic Year</span>
                <span className="font-bold text-slate-800">Final Year (Semester 7)</span>
              </div>
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                <span className="text-slate-400 uppercase font-bold block mb-1">Active Complaints</span>
                <span className="font-bold text-cms-green">1 Ticket Active (#1042)</span>
              </div>
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                <span className="text-slate-400 uppercase font-bold block mb-1">Resolved Complaints</span>
                <span className="font-bold text-slate-800">3 Tickets Resolved</span>
              </div>
            </div>

            <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
              <button 
                onClick={() => setActiveScreen('home')}
                className="text-xs font-bold text-cms-green hover:underline flex items-center space-x-1"
              >
                <LucideIcon name="arrow-left" className="w-3.5 h-3.5" />
                <span>Back to Complaint Filing Desk</span>
              </button>

              <button 
                onClick={() => setActiveScreen('login')}
                className="px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 font-bold text-xs rounded-xl transition-colors"
              >
                Log Out
              </button>
            </div>

          </div>
        </div>
      );
    };

    // --- NOTIFICATION DRAWER COMPONENT ---
    const NotificationDrawer = ({ isOpen, onClose, setActiveScreen }) => {
      if (!isOpen) return null;

      const notifications = [
        { id: 1, title: "SLA Warning Alert", desc: "SLA expires in 1h 10m for complaint #1042 (Canteen Dept)", time: "10 mins ago", type: "warning" },
        { id: 2, title: "Status Stage Updated", desc: "Complaint #1042 moved to 'In Progress' by Dr. Mehra", time: "1 hour ago", type: "info" },
        { id: 3, title: "Complaint Resolved", desc: "Complaint #1038 (Hostel Office) marked resolved", time: "2 days ago", type: "success" }
      ];

      return (
        <div className="fixed inset-0 z-50 overflow-hidden modal-backdrop animate-fade-in">
          <div className="absolute inset-0" onClick={onClose}></div>
          <div className="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div className="w-screen max-w-md bg-white shadow-2xl border-l border-slate-200 flex flex-col">
              
              {/* Header with Lotus Logo */}
              <div className="bg-cms-green text-white p-4 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <CMSLotusLogo size="sm" />
                  <h3 className="font-extrabold text-sm">Notifications Drawer</h3>
                </div>
                <button onClick={onClose} className="text-emerald-200 hover:text-white">
                  <LucideIcon name="x" className="w-5 h-5" />
                </button>
              </div>

              {/* List */}
              <div className="p-4 overflow-y-auto space-y-3 flex-1">
                {notifications.map((n) => (
                  <div 
                    key={n.id}
                    onClick={() => { onClose(); setActiveScreen('tracker'); }}
                    className={`p-3.5 rounded-xl border cursor-pointer transition-all ${
                      n.type === 'warning' 
                        ? 'bg-amber-50 border-amber-200 text-amber-950 hover:bg-amber-100' 
                        : 'bg-slate-50 border-slate-200 hover:bg-slate-100'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-extrabold flex items-center space-x-1">
                        {n.type === 'warning' && <LucideIcon name="alert-triangle" className="w-3.5 h-3.5 text-amber-600" />}
                        <span>{n.title}</span>
                      </span>
                      <span className="text-[10px] text-slate-400">{n.time}</span>
                    </div>
                    <p className="text-xs text-slate-600">{n.desc}</p>
                  </div>
                ))}
              </div>

              <div className="p-4 border-t border-slate-100 bg-slate-50 text-center">
                <button onClick={onClose} className="text-xs font-bold text-cms-green hover:underline">
                  Close Drawer
                </button>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // --- RESPONSIVE BOTTOM NAVIGATION BAR (MOBILE) ---
    const MobileBottomNav = ({ activeScreen, setActiveScreen, toggleNotificationDrawer }) => {
      return (
        <div className="md:hidden fixed bottom-0 left-0 right-0 bg-cms-green text-white border-t border-emerald-900/60 shadow-2xl z-40 px-2 py-1.5 flex items-center justify-around">
          
          <button 
            onClick={() => setActiveScreen('home')}
            className={`flex flex-col items-center p-1.5 rounded-lg text-[10px] font-bold ${
              activeScreen === 'home' ? 'text-cms-gold' : 'text-emerald-200 hover:text-white'
            }`}
          >
            <LucideIcon name="plus-circle" className="w-5 h-5 mb-0.5" />
            <span>File Desk</span>
          </button>

          <button 
            onClick={() => setActiveScreen('tracker')}
            className={`flex flex-col items-center p-1.5 rounded-lg text-[10px] font-bold relative ${
              activeScreen === 'tracker' ? 'text-cms-gold' : 'text-emerald-200 hover:text-white'
            }`}
          >
            <LucideIcon name="clock" className="w-5 h-5 mb-0.5" />
            <span>#1042 SLA</span>
            <span className="absolute top-1 right-3 w-2 h-2 rounded-full bg-cms-gold animate-ping"></span>
          </button>

          <button 
            onClick={() => setActiveScreen('my-complaints')}
            className={`flex flex-col items-center p-1.5 rounded-lg text-[10px] font-bold ${
              activeScreen === 'my-complaints' ? 'text-cms-gold' : 'text-emerald-200 hover:text-white'
            }`}
          >
            <LucideIcon name="list-checks" className="w-5 h-5 mb-0.5" />
            <span>Tickets</span>
          </button>

          <button 
            onClick={toggleNotificationDrawer}
            className="flex flex-col items-center p-1.5 rounded-lg text-[10px] font-bold text-emerald-200 hover:text-white"
          >
            <LucideIcon name="bell" className="w-5 h-5 mb-0.5" />
            <span>Alerts</span>
          </button>

          <button 
            onClick={() => setActiveScreen('profile')}
            className={`flex flex-col items-center p-1.5 rounded-lg text-[10px] font-bold ${
              activeScreen === 'profile' ? 'text-cms-gold' : 'text-emerald-200 hover:text-white'
            }`}
          >
            <LucideIcon name="user" className="w-5 h-5 mb-0.5" />
            <span>Profile</span>
          </button>

        </div>
      );
    };

    // --- MAIN APPLICATION ENTRY COMPONENT ---
    const App = () => {
      const [activeScreen, setActiveScreen] = useState('home');
      const [isRoutingModalOpen, setIsRoutingModalOpen] = useState(false);
      const [isNotifDrawerOpen, setIsNotifDrawerOpen] = useState(false);
      const [unreadCount, setUnreadCount] = useState(1);

      const handleConfirmRouting = () => {
        setIsRoutingModalOpen(false);
        setActiveScreen('tracker');
      };

      const isAuthPage = ['register', 'login', 'forgot-password'].includes(activeScreen);

      return (
        <div className="min-h-screen flex flex-col justify-between bg-cms-bg pb-16 md:pb-0">
          
          {/* Header Navigation */}
          {!isAuthPage && (
            <HeaderNav 
              activeScreen={activeScreen}
              setActiveScreen={setActiveScreen}
              unreadCount={unreadCount}
              toggleNotificationDrawer={() => setIsNotifDrawerOpen(!isNotifDrawerOpen)}
            />
          )}

          {/* Main Content Area */}
          <main className="flex-1">
            {activeScreen === 'register' && <RegisterScreen setActiveScreen={setActiveScreen} />}
            {activeScreen === 'login' && <LoginScreen setActiveScreen={setActiveScreen} />}
            {activeScreen === 'forgot-password' && <ForgotPasswordScreen setActiveScreen={setActiveScreen} />}
            
            {activeScreen === 'home' && (
              <ComplaintDeskScreen 
                onOpenRoutingModal={() => setIsRoutingModalOpen(true)}
                setActiveScreen={setActiveScreen}
              />
            )}
            
            {activeScreen === 'tracker' && <TicketTrackerScreen setActiveScreen={setActiveScreen} />}
            {activeScreen === 'my-complaints' && <MyComplaintsScreen setActiveScreen={setActiveScreen} />}
            {activeScreen === 'profile' && <ProfileScreen setActiveScreen={setActiveScreen} />}
          </main>

          {/* AI Routing Review Modal */}
          <AIRoutingModal 
            isOpen={isRoutingModalOpen}
            onClose={() => setIsRoutingModalOpen(false)}
            onConfirm={handleConfirmRouting}
          />

          {/* Notifications Drawer */}
          <NotificationDrawer 
            isOpen={isNotifDrawerOpen}
            onClose={() => setIsNotifDrawerOpen(false)}
            setActiveScreen={setActiveScreen}
          />

          {/* Mobile Sticky Bottom Navigation */}
          {!isAuthPage && (
            <MobileBottomNav 
              activeScreen={activeScreen}
              setActiveScreen={setActiveScreen}
              toggleNotificationDrawer={() => setIsNotifDrawerOpen(!isNotifDrawerOpen)}
            />
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-4 px-4 text-center border-t border-slate-800">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="flex items-center space-x-2">
                <CMSLotusLogo size="sm" />
                <span className="font-bold text-slate-200">CMS College of Engineering</span>
                <span>• AI-Powered Student Portal</span>
              </div>
              <p className="text-[11px] text-slate-500">
                © 2026 CMSCE AI Complaint Desk. All rights reserved.
              </p>
            </div>
          </footer>

        </div>
      );
    };

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
